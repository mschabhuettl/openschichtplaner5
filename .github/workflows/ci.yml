name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ./lib -e ./api -r requirements-dev.txt
      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy lib/sp5lib api/sp5api
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build both packages
        run: |
          python -m pip install build
          python -m build --outdir dist lib
          python -m build --outdir dist api
      - name: Install the wheels and run the command line tools
        run: |
          python -m pip install dist/*.whl
          sp5lib create /tmp/sp5data
          sp5lib validate /tmp/sp5data
          sp5api --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
